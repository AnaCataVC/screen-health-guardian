name: Release Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Installer
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Automated Tests
        run: dotnet test tests/ScreenHealthGuardian.Tests/ScreenHealthGuardian.Tests.csproj -c Release

      - name: Publish Standalone Binary (win-x64)
        run: |
          dotnet publish src/ScreenHealthGuardian.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o releases/win-x64

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $isccPath)) {
            Write-Error "Inno Setup compiler (ISCC.exe) not found on runner."
            exit 1
          }
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          & $isccPath /DMyAppVersion=$tagVersion installer.iss

      - name: Verify Deliverable
        shell: pwsh
        run: |
          $installer = "releases\ScreenHealthGuardian-Setup.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer deliverable not found at $installer"
            exit 1
          }
          Write-Host "Found installer deliverable: $installer"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/ScreenHealthGuardian-Setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
